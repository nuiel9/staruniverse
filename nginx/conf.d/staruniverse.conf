server {
    # Rendered from a template at container start so Cloud Run's $PORT wins.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets, so those files are immutable
    # by construction: a change produces a new filename. Anything else —
    # index.html above all — must not be cached, or a deploy ships new assets
    # to browsers still holding the old document that references the old ones.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A single-page bundle with no router: anything unknown is a 404, not a
    # rewrite to index.html. Serving the game for /favicon-nonsense.png would
    # hide real mistakes behind a page that loads.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cloud Run health checks and uptime probes, without pulling the bundle.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
